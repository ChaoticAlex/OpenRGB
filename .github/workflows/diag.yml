name: diag
on:
  workflow_dispatch:

jobs:
  d:
    runs-on: windows-2022
    steps:
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          arch: win64_msvc2022_64
          dir: 'C:/Qt'
          modules: 'qt5compat'
      - name: inspect
        shell: cmd
        run: |
          echo === C:\Qt ===
          dir /b C:\Qt
          echo === bin Qt6*.dll ===
          dir /b C:\Qt\6.8.3\msvc2022_64\bin\Qt6*.dll
          echo === search Core5Compat anywhere under C:\Qt ===
          dir /s /b C:\Qt\Qt6Core5Compat.dll
          dir /s /b C:\Qt\Qt6OpenGL.dll
